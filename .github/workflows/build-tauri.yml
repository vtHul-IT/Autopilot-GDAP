name: Build CaptureTech Autopilot GDAP

on:
  pull_request:
    branches:
      - master
  push:
    tags:
      - "tauri-v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  portable-windows-exe:
    runs-on: windows-latest

    steps:
      - name: Repository ophalen
        uses: actions/checkout@v4

      - name: Node.js instellen
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tauri-app/package-lock.json

      - name: Rust instellen
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Frontend afhankelijkheden installeren
        working-directory: tauri-app
        run: npm ci

      # npm can omit a platform-specific optional package when package-lock.json
      # was generated on another operating system. Tauri's CLI loads this native
      # Windows binding at startup, so install the matching binding explicitly.
      - name: Windows Tauri CLI-binding herstellen
        working-directory: tauri-app
        shell: pwsh
        run: |
          $tauriCliVersion = node -p "require('./node_modules/@tauri-apps/cli/package.json').version"
          npm install --no-save --package-lock=false --include=optional "@tauri-apps/cli-win32-x64-msvc@$tauriCliVersion"

      - name: Frontend controleren
        working-directory: tauri-app
        run: npm run build

      - name: PowerShell-workercontracten testen
        shell: pwsh
        run: powershell.exe -NoLogo -NoProfile -ExecutionPolicy Bypass -File tauri-app/powershell/AutopilotGdap.Engine.Tests.ps1

      - name: Rust-tests uitvoeren
        working-directory: tauri-app/src-tauri
        run: cargo test

      - name: Portable EXE bouwen
        working-directory: tauri-app
        run: npm run tauri -- build --no-bundle --target x86_64-pc-windows-msvc

      - name: SHA-256 checksum maken
        shell: pwsh
        run: |
          $releaseDirectory = "tauri-app/src-tauri/target/x86_64-pc-windows-msvc/release"
          $exe = Join-Path $releaseDirectory "capturetech-autopilot-gdap.exe"
          $hash = (Get-FileHash -LiteralPath $exe -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  capturetech-autopilot-gdap.exe" | Set-Content -LiteralPath (Join-Path $releaseDirectory "capturetech-autopilot-gdap.exe.sha256") -Encoding ascii

      - name: EXE als artifact bewaren
        uses: actions/upload-artifact@v4
        with:
          name: CaptureTech-Autopilot-GDAP-x64
          path: |
            tauri-app/src-tauri/target/x86_64-pc-windows-msvc/release/capturetech-autopilot-gdap.exe
            tauri-app/src-tauri/target/x86_64-pc-windows-msvc/release/capturetech-autopilot-gdap.exe.sha256
          if-no-files-found: error

  publish-release:
    if: startsWith(github.ref, 'refs/tags/tauri-v')
    needs: portable-windows-exe
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Release-artifact ophalen
        uses: actions/download-artifact@v4
        with:
          name: CaptureTech-Autopilot-GDAP-x64
          path: release-artifacts

      - name: GitHub Release publiceren
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            release-artifacts/capturetech-autopilot-gdap.exe
            release-artifacts/capturetech-autopilot-gdap.exe.sha256

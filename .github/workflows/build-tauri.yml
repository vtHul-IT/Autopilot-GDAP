name: Build CaptureTech Autopilot GDAP

on:
  pull_request:
    branches:
      - master
  push:
    tags:
      - "tauri-v*"
  workflow_dispatch:
    inputs:
      sign_test:
        description: "Onderteken een testartifact via de protected release-signing environment, zonder GitHub Release te publiceren"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  portable-windows-exe:
    runs-on: windows-latest

    steps:
      - name: Repository ophalen
        uses: actions/checkout@v4

      - name: Node.js instellen
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tauri-app/package-lock.json

      - name: Rust instellen
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Frontend afhankelijkheden installeren
        working-directory: tauri-app
        run: npm ci

      # npm can omit a platform-specific optional package when package-lock.json
      # was generated on another operating system. Tauri's CLI loads this native
      # Windows binding at startup, so install the matching binding explicitly.
      - name: Windows Tauri CLI-binding herstellen
        working-directory: tauri-app
        shell: pwsh
        run: |
          $tauriCliVersion = node -p "require('./node_modules/@tauri-apps/cli/package.json').version"
          npm install --no-save --package-lock=false --include=optional "@tauri-apps/cli-win32-x64-msvc@$tauriCliVersion"

      - name: Frontend controleren
        working-directory: tauri-app
        run: npm run build

      - name: PowerShell-workercontracten testen
        shell: pwsh
        run: powershell.exe -NoLogo -NoProfile -ExecutionPolicy Bypass -File tauri-app/powershell/AutopilotGdap.Engine.Tests.ps1

      - name: Rust-tests uitvoeren
        working-directory: tauri-app/src-tauri
        run: cargo test

      - name: Portable EXE bouwen
        working-directory: tauri-app
        run: npm run tauri -- build --no-bundle --target x86_64-pc-windows-msvc

      - name: SHA-256 checksum maken
        shell: pwsh
        run: |
          $releaseDirectory = "tauri-app/src-tauri/target/x86_64-pc-windows-msvc/release"
          $exe = Join-Path $releaseDirectory "capturetech-autopilot-gdap.exe"
          $hash = (Get-FileHash -LiteralPath $exe -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  capturetech-autopilot-gdap.exe" | Set-Content -LiteralPath (Join-Path $releaseDirectory "capturetech-autopilot-gdap.exe.sha256") -Encoding ascii

      - name: EXE als artifact bewaren
        uses: actions/upload-artifact@v4
        with:
          name: CaptureTech-Autopilot-GDAP-unsigned-x64
          path: |
            tauri-app/src-tauri/target/x86_64-pc-windows-msvc/release/capturetech-autopilot-gdap.exe
            tauri-app/src-tauri/target/x86_64-pc-windows-msvc/release/capturetech-autopilot-gdap.exe.sha256
          if-no-files-found: error

  sign-release-artifact:
    if: startsWith(github.ref, 'refs/tags/tauri-v') || (github.event_name == 'workflow_dispatch' && inputs.sign_test)
    needs: portable-windows-exe
    runs-on: windows-2022
    environment: release-signing
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Signingconfiguratie controleren
        shell: pwsh
        env:
          AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          AZURE_ARTIFACT_SIGNING_ENDPOINT: ${{ vars.AZURE_ARTIFACT_SIGNING_ENDPOINT }}
          AZURE_ARTIFACT_SIGNING_ACCOUNT: ${{ vars.AZURE_ARTIFACT_SIGNING_ACCOUNT }}
          AZURE_ARTIFACT_SIGNING_PROFILE: ${{ vars.AZURE_ARTIFACT_SIGNING_PROFILE }}
          AZURE_SIGNING_PUBLISHER_SUBJECT: ${{ vars.AZURE_SIGNING_PUBLISHER_SUBJECT }}
        run: |
          $required = @(
            'AZURE_CLIENT_ID',
            'AZURE_TENANT_ID',
            'AZURE_SUBSCRIPTION_ID',
            'AZURE_ARTIFACT_SIGNING_ENDPOINT',
            'AZURE_ARTIFACT_SIGNING_ACCOUNT',
            'AZURE_ARTIFACT_SIGNING_PROFILE',
            'AZURE_SIGNING_PUBLISHER_SUBJECT'
          )
          $missing = $required | Where-Object { [string]::IsNullOrWhiteSpace([Environment]::GetEnvironmentVariable($_)) }
          if ($missing) {
            throw "De protected GitHub Environment 'release-signing' mist variabelen: $($missing -join ', '). Een release mag niet unsigned worden gepubliceerd."
          }

      - name: Niet-ondertekend artifact ophalen
        uses: actions/download-artifact@v4
        with:
          name: CaptureTech-Autopilot-GDAP-unsigned-x64
          path: release-artifacts

      - name: Aanmelden bij Azure via GitHub OIDC
        uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: EXE ondertekenen met Azure Artifact Signing
        uses: azure/artifact-signing-action@v2
        with:
          endpoint: ${{ vars.AZURE_ARTIFACT_SIGNING_ENDPOINT }}
          signing-account-name: ${{ vars.AZURE_ARTIFACT_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ vars.AZURE_ARTIFACT_SIGNING_PROFILE }}
          files: ${{ github.workspace }}\release-artifacts\capturetech-autopilot-gdap.exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      - name: Authenticode-handtekening verifiëren
        shell: pwsh
        env:
          AZURE_SIGNING_PUBLISHER_SUBJECT: ${{ vars.AZURE_SIGNING_PUBLISHER_SUBJECT }}
        run: |
          $exe = Join-Path $PWD 'release-artifacts\capturetech-autopilot-gdap.exe'
          $signature = Get-AuthenticodeSignature -LiteralPath $exe
          if ($signature.Status -ne [System.Management.Automation.SignatureStatus]::Valid) {
            throw "Authenticode-validatie is niet geldig: $($signature.Status) $($signature.StatusMessage)"
          }
          $subject = $signature.SignerCertificate.Subject
          if ($subject -notlike "*$env:AZURE_SIGNING_PUBLISHER_SUBJECT*") {
            throw "Onverwachte signing publisher: '$subject'. Verwacht bevat: '$env:AZURE_SIGNING_PUBLISHER_SUBJECT'."
          }
          if ($null -eq $signature.TimeStamperCertificate) {
            throw 'De ondertekende EXE bevat geen RFC3161-timestamp.'
          }
          Write-Host "Geldige handtekening van: $subject"

      - name: SHA-256 van signed EXE maken
        shell: pwsh
        run: |
          $exe = Join-Path $PWD 'release-artifacts\capturetech-autopilot-gdap.exe'
          $hash = (Get-FileHash -LiteralPath $exe -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  capturetech-autopilot-gdap.exe" | Set-Content -LiteralPath (Join-Path $PWD 'release-artifacts\capturetech-autopilot-gdap.exe.sha256') -Encoding ascii

      - name: Signed EXE als artifact bewaren
        uses: actions/upload-artifact@v4
        with:
          name: CaptureTech-Autopilot-GDAP-signed-x64
          path: |
            release-artifacts/capturetech-autopilot-gdap.exe
            release-artifacts/capturetech-autopilot-gdap.exe.sha256
          if-no-files-found: error

      - name: Publicatieconfiguratie controleren
        if: startsWith(github.ref, 'refs/tags/tauri-v')
        shell: pwsh
        env:
          RELEASE_PUBLISHER_APP_ID: ${{ vars.RELEASE_PUBLISHER_APP_ID }}
          RELEASE_PUBLISHER_APP_PRIVATE_KEY: ${{ secrets.RELEASE_PUBLISHER_APP_PRIVATE_KEY }}
        run: |
          $required = @('RELEASE_PUBLISHER_APP_ID', 'RELEASE_PUBLISHER_APP_PRIVATE_KEY')
          $missing = $required | Where-Object { [string]::IsNullOrWhiteSpace([Environment]::GetEnvironmentVariable($_)) }
          if ($missing) {
            throw "De protected GitHub Environment 'release-signing' mist publicatieconfiguratie: $($missing -join ', '). Een signed release mag niet naar de downloadrepository worden gepubliceerd."
          }

      - name: Token voor publieke downloadrepository maken
        if: startsWith(github.ref, 'refs/tags/tauri-v')
        id: public-release-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.RELEASE_PUBLISHER_APP_ID }}
          private-key: ${{ secrets.RELEASE_PUBLISHER_APP_PRIVATE_KEY }}
          owner: vtHul-IT
          repositories: Autopilot-GDAP-Downloads

      - name: Publieke releasenotities maken
        if: startsWith(github.ref, 'refs/tags/tauri-v')
        shell: pwsh
        run: |
          $tag = $env:GITHUB_REF_NAME
          @"
          # CaptureTech Autopilot GDAP $tag

          Deze portable Windows x64-app is ondertekend met Azure Artifact Signing
          voor **CaptureTech IT-Services BV**.

          Controleer voor gebruik de meegeleverde SHA-256-checksum en de
          Authenticode-handtekening van `capturetech-autopilot-gdap.exe`.

          Broncode en technische documentatie worden beheerd in een private
          CaptureTech-repository.
          "@ | Set-Content -LiteralPath (Join-Path $PWD 'release-artifacts\RELEASE-NOTES.md') -Encoding utf8

      - name: Public signed release publiceren
        if: startsWith(github.ref, 'refs/tags/tauri-v')
        uses: softprops/action-gh-release@v3
        with:
          repository: vtHul-IT/Autopilot-GDAP-Downloads
          token: ${{ steps.public-release-token.outputs.token }}
          tag_name: ${{ github.ref_name }}
          target_commitish: main
          name: CaptureTech Autopilot GDAP ${{ github.ref_name }}
          body_path: release-artifacts/RELEASE-NOTES.md
          files: |
            release-artifacts/capturetech-autopilot-gdap.exe
            release-artifacts/capturetech-autopilot-gdap.exe.sha256
